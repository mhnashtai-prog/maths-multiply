<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Array Garden — see multiplication grow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFE9F7; --sky-bot:#EAF7E0;
    --grass:#8FC26A; --grass-dark:#6FA84C; --soil:#7C5A3C; --soil-dark:#5E4229;
    --sun:#FFC93C; --sun-dark:#E8A61E;
    --apple:#E85B4A; --apple-dark:#C63F30; --leaf:#4C8C3D;
    --ink:#33422E; --ink-soft:#5B6B54;
    --card:#FFFDF6; --card-edge:#EBE1C8;
    --pop:#8B6BD8;
    --radius:22px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; overflow-x:hidden; }
  body{
    font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, var(--grass) 62%, var(--grass-dark) 100%);
    min-height:100vh; padding-bottom:2rem; transition:background 1s ease;
    -webkit-user-select:none; user-select:none;
  }
  .display{ font-family:'Baloo 2',sans-serif; }

  /* ---------- theme skins ----------
     Only the palette and the ground colour change per theme — the grid,
     the tap-to-plant mechanic and the equation logic are identical
     underneath, so a theme is purely "what am I picturing", never "how
     does the maths work". */
  body.theme-dragon{ --sky-top:#2E2A4A; --sky-bot:#4A3B6B; --grass:#5B4A8A; --grass-dark:#3E3160; --soil:#3E3160; --soil-dark:#2A2148; --pop:#FFC93C; }
  body.theme-star{ --sky-top:#121F3D; --sky-bot:#243B6B; --grass:#2C4A82; --grass-dark:#1B2F5C; --soil:#1B2F5C; --soil-dark:#12203F; --pop:#FFC93C; }
  body.theme-dragon .sun, body.theme-star .sun{ opacity:.15; }
  body.theme-dragon .cloud, body.theme-star .cloud{ opacity:.12; }
  body.theme-dragon h1, body.theme-star h1{ color:#E8E4FF; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  body.theme-dragon .sub, body.theme-star .sub{ color:#C9C2F0; }
  body.theme-star .sub{ color:#AEC4F0; }

  /* ---------- picker rows (theme + number pills) ---------- */
  .pickers{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:.5rem; margin-top:1.3rem; }
  .pickerRow{ display:flex; gap:.45rem; flex-wrap:wrap; justify-content:center; }
  .pickerLabel{ font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.7); text-shadow:0 1px 2px rgba(0,0,0,.2); }
  .pill{
    font-family:'Baloo 2',sans-serif; font-weight:700; border:none; cursor:pointer;
    border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.14); transition:transform .1s, background .15s, color .15s;
  }
  .pill:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .themePill{ font-size:1.35rem; width:2.5rem; height:2.5rem; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.55); }
  .themePill.active{ background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.14), 0 0 0 3px var(--pop); }
  .numPill{ font-size:.95rem; padding:.45rem 1rem; background:rgba(255,255,255,.55); color:var(--ink); }
  .numPill.active{ background:var(--pop); color:#fff; }

  /* ---------- sun + clouds, ambient only ---------- */
  .sun{
    position:absolute; top:1.1rem; right:1.4rem; width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE18A, var(--sun) 60%, var(--sun-dark) 100%);
    box-shadow:0 0 30px rgba(255,201,60,.55); z-index:0;
  }
  .cloud{ position:absolute; opacity:.9; z-index:0; }
  .cloud svg{ width:70px; }
  .cloud.c1{ top:1.6rem; left:8%; } .cloud.c2{ top:3.4rem; left:32%; width:50px; opacity:.7; }

  /* ---------- header ---------- */
  header{ position:relative; z-index:2; text-align:center; padding:1.1rem 1rem .3rem; }
  h1{ margin:0; font-size:clamp(1.5rem,5vw,2.1rem); font-weight:800; color:#2c5a2e;
      text-shadow:0 2px 0 rgba(255,255,255,.55); letter-spacing:.01em; }
  .sub{ font-weight:600; color:#3c6b3a; font-size:.85rem; margin-top:.15rem; }

  .topbar{ position:relative; z-index:2; display:flex; justify-content:center; gap:.6rem; align-items:center; margin-top:.6rem; }
  .stars{
    display:flex; align-items:center; gap:.3rem; background:rgba(255,255,255,.72); backdrop-filter:blur(6px);
    border-radius:999px; padding:.35rem .8rem; font-weight:700; color:#7a5a12; font-size:.85rem;
    box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
  .soundbtn{
    background:rgba(255,255,255,.72); border:none; border-radius:999px; width:34px; height:34px;
    font-size:1rem; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.06);
  }
.backBtn{
  position:absolute; top:.9rem; left:.9rem; z-index:3;
  display:inline-flex; align-items:center; gap:.3rem;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.8rem;
  text-decoration:none; color:var(--ink);
  background:rgba(255,255,255,.72); border-radius:999px; padding:.4rem .8rem;
  box-shadow:0 2px 0 rgba(0,0,0,.1);
}
.backBtn:active{ transform:translateY(1px); }
  /* ---------- order card ---------- */
  .orderwrap{ position:relative; z-index:2; display:flex; justify-content:center; margin:.9rem 1rem 0; }
  .order{
    background:var(--card); border:3px solid var(--card-edge); border-radius:var(--radius);
    padding:.85rem 1.3rem; max-width:30rem; width:100%; text-align:center;
    box-shadow:0 8px 0 rgba(0,0,0,.08), 0 14px 24px rgba(0,0,0,.12);
    display:flex; align-items:center; gap:.8rem;
  }
  .bee{ font-size:2.1rem; flex-shrink:0; animation:hover 2.4s ease-in-out infinite; }
  @keyframes hover{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-5px) rotate(4deg);} }
  .order-text{ text-align:left; }
  .order-text .who{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .order-text .ask{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(1rem,3.4vw,1.3rem); color:var(--ink); line-height:1.25; }
  .order-text .ask b{ color:var(--apple-dark); }

  /* ---------- equation strip ---------- */
  .eqwrap{ position:relative; z-index:2; display:flex; justify-content:center; margin:.7rem 1rem 0; min-height:2.6rem; }
  .eq{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(1rem,3.6vw,1.4rem);
    color:#3c6b3a; background:rgba(255,255,255,.55); border-radius:999px; padding:.35rem 1.1rem;
    transition:transform .2s, background .2s; display:flex; align-items:center; gap:.4rem;
  }
  .eq .final{ color:var(--apple-dark); }
  .eq.pulse{ animation:eqpop .35s ease; }
  @keyframes eqpop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.12);} 100%{ transform:scale(1);} }

  /* ---------- garden bed ---------- */
  .bedwrap{ position:relative; z-index:2; display:flex; justify-content:center; margin:.9rem 1rem 0; }
  .bed{
    background:linear-gradient(180deg, var(--soil) 0%, var(--soil-dark) 100%);
    border-radius:20px; padding:1.1rem; box-shadow:inset 0 3px 10px rgba(0,0,0,.35), 0 10px 0 rgba(0,0,0,.12);
    display:grid; gap:.55rem; transition:transform .55s cubic-bezier(.3,1,.4,1);
  }
  .hole{
    width:56px; height:56px; border-radius:14px; cursor:pointer;
    background:radial-gradient(ellipse at 50% 65%, rgba(0,0,0,.32), rgba(0,0,0,.14) 70%);
    border:2px dashed rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; position:relative;
    transition:border-color .15s, background .15s;
  }
  .hole:hover{ border-color:rgba(255,255,255,.55); }
  .hole .apple{
    font-size:1.9rem; transform:scale(0); filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));
  }
  .hole.filled .apple{ animation:plant .38s cubic-bezier(.3,1.8,.4,1) forwards; }
  @keyframes plant{ 0%{ transform:scale(0) rotate(-25deg);} 60%{ transform:scale(1.25) rotate(8deg);} 100%{ transform:scale(1) rotate(0deg);} }
  .hole.filled{ background:radial-gradient(ellipse at 50% 70%, rgba(76,140,61,.35), transparent 70%); border-style:solid; border-color:rgba(255,255,255,.12); }

  @media(max-width:480px){ .hole{ width:44px; height:44px; } .hole .apple{ font-size:1.5rem; } .bed{ padding:.8rem; gap:.4rem; } }

  /* ---------- controls ---------- */
  .controls{ position:relative; z-index:2; display:flex; justify-content:center; gap:.7rem; margin-top:1.1rem; flex-wrap:wrap; }
  button.action{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.95rem; letter-spacing:.01em;
    padding:.65rem 1.4rem; border-radius:999px; border:none; cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.15); transition:transform .1s;
  }
  button.action:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  button.action:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .btn-rotate{ background:var(--pop); color:#fff; }
  .btn-next{ background:var(--sun); color:#6b4a06; }

  /* ---------- speech tip ---------- */
  .tip{
    position:relative; z-index:2; text-align:center; margin-top:.8rem; padding:0 1.2rem;
    font-size:.85rem; font-weight:600; color:#3c6b3a; min-height:1.2em;
  }

  /* ---------- harvest celebration ---------- */
  .spark{ position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:50; }

  .toast{
    position:fixed; left:50%; top:14%; transform:translate(-50%,-14px); z-index:60;
    background:var(--card); border:3px solid var(--sun); border-radius:18px; padding:.8rem 1.4rem;
    font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--ink); text-align:center;
    box-shadow:0 10px 26px rgba(0,0,0,.22); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<a class="backBtn" href="index.html">← Menu</a>
<div class="sun"></div>
<div class="cloud c1"><svg viewBox="0 0 100 50" fill="#fff"><ellipse cx="30" cy="30" rx="26" ry="16"/><ellipse cx="55" cy="24" rx="20" ry="14"/><ellipse cx="72" cy="32" rx="18" ry="12"/></svg></div>
<div class="cloud c2"><svg viewBox="0 0 100 50" fill="#fff"><ellipse cx="30" cy="30" rx="26" ry="16"/><ellipse cx="55" cy="24" rx="20" ry="14"/></svg></div>

<header>
  <h1>🌱 Array Garden</h1>
  <div class="sub" id="subLine">plant the apples to fill the order</div>
</header>

<div class="topbar">
  <div class="stars">🌻 <span id="starCount">0</span> gardens grown</div>
  <button class="soundbtn" id="soundBtn" title="Toggle sound">🔊</button>
</div>

<div class="orderwrap">
  <div class="order">
    <div class="bee" id="mascot">🐝</div>
    <div class="order-text">
      <div class="who" id="orderWho">Buzzby needs</div>
      <div class="ask" id="orderText">…</div>
    </div>
  </div>
</div>

<div class="eqwrap"><div class="eq" id="eqLine">tap a hole to start planting</div></div>

<div class="bedwrap"><div class="bed" id="bed"></div></div>

<div class="controls">
  <button class="action btn-rotate" id="rotateBtn" disabled>🔄 <span id="rotateLabel">Turn the garden</span></button>
  <button class="action btn-next" id="nextBtn">🌼 New order</button>
</div>

<div class="pickers">
  <div class="pickerRow"><span class="pickerLabel">choose your world</span></div>
  <div class="pickerRow" id="themeRow"></div>
  <div class="pickerRow"><span class="pickerLabel">practise the table of…</span></div>
  <div class="pickerRow" id="numRow"></div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const bed = $('bed'), orderText = $('orderText'), eqLine = $('eqLine'), tip = $('tip');
const rotateBtn = $('rotateBtn'), nextBtn = $('nextBtn'), soundBtn = $('soundBtn');

let rows, cols, filled, filledCount, harvested, rotated, gardensGrown = 0;
let soundOn = true;

/* ---------- themes ----------
   Only the picture and the words change here — verb, mascot, item, and
   accent colour. The grid mechanic, the equation logic and the rotation
   discovery underneath are identical for every theme, so switching worlds
   can never change what's actually being taught, only what it looks like. */
const THEMES = {
  apple:  { label:'Apple garden', emoji:'🍎', mascot:'🐝', who:'Buzzby needs',        verb:'plant', itemPlural:'apples', container:'garden', harvestMsg:'Garden grown!',  bodyClass:'' },
  dragon: { label:'Dragon nest',  emoji:'🥚', mascot:'🐉', who:"Tim's dragon needs",  verb:'hatch', itemPlural:'eggs',   container:'nest',   harvestMsg:'Eggs hatched!',  bodyClass:'theme-dragon' },
  star:   { label:'Star sky',     emoji:'⭐', mascot:'🦉', who:'Luna needs',          verb:'catch', itemPlural:'stars',  container:'sky',     harvestMsg:'Stars caught!', bodyClass:'theme-star' },
};
let theme = 'apple';
let focusNumber = null;   // null = mixed practice, 1-5 = one times table locked in

/* ---------- tiny synth, no files ---------- */
let actx;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
function tone(freq,dur,type,vol,delay){
  if(!soundOn) return; ensureAudio();
  const t0=actx.currentTime+(delay||0), osc=actx.createOscillator(), gain=actx.createGain();
  osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0); gain.gain.linearRampToValueAtTime(vol||.18,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(gain).connect(actx.destination); osc.start(t0); osc.stop(t0+dur+.02);
}
const sfxPlant = () => tone(560+Math.random()*120,.11,'triangle',.15);
const sfxUnplant = () => tone(260,.09,'sawtooth',.1);
const sfxRotate = () => { [420,560,700].forEach((f,i)=>tone(f,.12,'sine',.13,i*.05)); };
const sfxHarvest = () => [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));
soundBtn.onclick = () => { soundOn=!soundOn; soundBtn.textContent = soundOn?'🔊':'🔇'; if(soundOn) ensureAudio(); };

/* ---------- order generation ----------
   With no table selected (focusNumber null), both sides vary 2-5, same as
   before. With a table selected, ROWS is pinned to that number every
   round and only COLS varies 2-5 — so a kid on "table of 3" sees
   3 rows of 2, 3 rows of 4, 3 rows of 5... always 3 rows, which is what
   "practising the 3s" actually means. Never repeats the exact same shape
   twice running, in either mode. */
let lastShape = '';
function newOrder(){
  let r, c;
  if (focusNumber){
    r = focusNumber;
    do { c = 2 + Math.floor(Math.random()*4); } while ((r+'x'+c) === lastShape);
  } else {
    do { r = 2 + Math.floor(Math.random()*4); c = 2 + Math.floor(Math.random()*4); }
    while ((r+'x'+c) === lastShape);
  }
  lastShape = r+'x'+c;
  rows = r; cols = c;
  filled = Array.from({length:rows}, () => Array(cols).fill(false));
  filledCount = 0; harvested = false; rotated = false;
  const t = THEMES[theme];
  orderText.innerHTML = `<b>${rows} rows</b> of <b>${cols}</b> ${t.emoji}`;
  eqLine.textContent = `tap a hole to start ${t.verb}ing`;
  rotateBtn.disabled = true;
  tip.textContent = rows*cols <= 6 ? 'small garden — count as you go!' : '';
  renderBed();
}

function renderBed(){
  const emoji = THEMES[theme].emoji;
  bed.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  bed.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  bed.innerHTML = '';
  for (let r = 0; r < rows; r++){
    for (let c = 0; c < cols; c++){
      const hole = document.createElement('div');
      hole.className = 'hole' + (filled[r][c] ? ' filled' : '');
      hole.innerHTML = `<span class="apple">${emoji}</span>`;
      hole.onclick = () => toggleHole(r, c);
      bed.appendChild(hole);
    }
  }
}

function toggleHole(r, c){
  if (harvested) return;
  ensureAudio();
  if (!filled[r][c]){
    filled[r][c] = true; filledCount++;
    sfxPlant();
  } else {
    filled[r][c] = false; filledCount--;
    sfxUnplant();
  }
  renderBed();
  updateEquation();
}

/* Live repeated-addition sentence, one term per completed row, so a kid
   watches the addition build into the multiplication rather than being
   told the multiplication is "the same thing" after the fact. */
function updateEquation(){
  const total = rows*cols;
  if (filledCount === 0){ eqLine.textContent = `tap a hole to start ${THEMES[theme].verb}ing`; return; }
  if (filledCount === total){
    eqLine.innerHTML = `${rows} <span style="opacity:.6">rows of</span> ${cols} <span style="opacity:.6">=</span> <span class="final">${rows} × ${cols} = ${total}</span>`;
    pulse();
    harvest();
    return;
  }
  const fullRows = filled.filter(row => row.every(Boolean)).length;
  const partial = filled.some((row,i) => !row.every(Boolean) && row.some(Boolean));
  let terms = Array(fullRows).fill(cols);
  let text = terms.length ? terms.join(' + ') : '';
  if (partial || (fullRows===0 && filledCount>0)) {
    const loose = filledCount - fullRows*cols;
    if (loose > 0) text += (text? ' + ':'') + loose;
  }
  eqLine.textContent = (text || filledCount) + '   (so far)';
  pulse();
}
function pulse(){ eqLine.classList.remove('pulse'); void eqLine.offsetWidth; eqLine.classList.add('pulse'); }

function harvest(){
  harvested = true;
  rotateBtn.disabled = false;
  sfxHarvest();
  const t = THEMES[theme];
  showToast(`🎉 ${rows} × ${cols} = ${rows*cols}! ${t.harvestMsg}`);
  burst();
  gardensGrown++;
  $('starCount').textContent = gardensGrown;
  tip.textContent = `try the turn button — same ${t.itemPlural}, new rows!`;
}

/* ---------- the discovery moment: commutativity by rotation ----------
   Transposes the filled grid (rows<->cols) and re-renders with a CSS
   rotation flourish, so 3x4 visibly becomes 4x3 — same total, new shape,
   nothing recounted or retaught, just seen. */
function rotateGarden(){
  if (!harvested) return;
  sfxRotate();
  bed.style.transform = 'rotate(8deg) scale(.92)';
  setTimeout(() => {
    const nf = Array.from({length:cols}, (_,r) => Array.from({length:rows}, (_,c) => filled[c][r]));
    [rows, cols] = [cols, rows];
    filled = nf;
    const t = THEMES[theme];
    orderText.innerHTML = `<b>${rows} rows</b> of <b>${cols}</b> ${t.emoji}`;
    renderBed();
    bed.style.transform = 'rotate(-6deg) scale(.92)';
    requestAnimationFrame(() => { bed.style.transform = 'rotate(0deg) scale(1)'; });
    eqLine.innerHTML = `${rows} × ${cols} <span style="opacity:.6">is still</span> <span class="final">${rows*cols}</span> <span style="opacity:.6">— just turned!</span>`;
    pulse();
    rotated = true;
    tip.textContent = `same ${t.itemPlural}, different rows — multiplication works both ways`;
  }, 260);
}
rotateBtn.onclick = rotateGarden;
nextBtn.onclick = newOrder;

/* ---------- picker rows: theme + table-of-N ---------- */
function buildPickers(){
  const themeRow = $('themeRow');
  themeRow.innerHTML = '';
  Object.entries(THEMES).forEach(([key, t]) => {
    const b = document.createElement('button');
    b.className = 'pill themePill' + (key === theme ? ' active' : '');
    b.textContent = t.emoji;
    b.title = t.label;
    b.setAttribute('aria-label', t.label);
    b.onclick = () => selectTheme(key);
    themeRow.appendChild(b);
  });

  const numRow = $('numRow');
  numRow.innerHTML = '';
  const mixBtn = document.createElement('button');
  mixBtn.className = 'pill numPill' + (focusNumber === null ? ' active' : '');
  mixBtn.textContent = 'mix';
  mixBtn.title = 'A bit of everything';
  mixBtn.onclick = () => selectNumber(null);
  numRow.appendChild(mixBtn);
  [1,2,3,4,5].forEach(n => {
    const b = document.createElement('button');
    b.className = 'pill numPill' + (focusNumber === n ? ' active' : '');
    b.textContent = n;
    b.title = `Only the ${n} times table`;
    b.onclick = () => selectNumber(n);
    numRow.appendChild(b);
  });
}

function applyThemeChrome(){
  const t = THEMES[theme];
  $('mascot').textContent = t.mascot;
  $('orderWho').textContent = t.who;
  $('rotateLabel').textContent = `Turn the ${t.container}`;
  $('subLine').textContent = `${t.verb} the ${t.itemPlural} to fill the order`;
}

function selectTheme(key){
  if (key === theme) return;
  theme = key;
  document.body.className = THEMES[key].bodyClass;
  lastShape = '';
  buildPickers();
  applyThemeChrome();
  newOrder();
}

function selectNumber(n){
  if (n === focusNumber) return;
  focusNumber = n;
  lastShape = '';
  buildPickers();
  newOrder();
}

function showToast(text){
  const t = $('toast'); t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}
function burst(){
  const cols = ['#FFC93C','#E85B4A','#4C8C3D','#8B6BD8','#fff'];
  const cx = window.innerWidth/2, cy = bed.getBoundingClientRect().top + bed.offsetHeight/2;
  for (let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = cols[(Math.random()*cols.length)|0];
    document.body.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 60+Math.random()*160;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 40;
    const dur = 700+Math.random()*400;
    p.animate([
      { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy+120}px) scale(.3)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.15,.7,.3,1)' });
    setTimeout(()=>p.remove(), dur+30);
  }
}

buildPickers();
applyThemeChrome();
newOrder();
</script>
