<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fair Share — split the pile and see what fits</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#BFE9F7; --sky-bot:#EAF7E0; --grass:#8FC26A; --grass-dark:#6FA84C;
    --sun:#FFC93C; --sun-dark:#E8A61E; --apple:#E85B4A; --apple-dark:#C63F30;
    --pop:#8B6BD8; --ink:#33422E; --ink-soft:#5B6B54; --card:#FFFDF6; --card-edge:#EBE1C8;
    --basket:#C88A4A; --basket-dark:#9C6530; --warn:#E8A63C; --radius:22px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; min-height:100%; overflow-x:hidden; }
  body{
    font-family:'Quicksand',sans-serif; color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 62%, var(--grass) 62%, var(--grass-dark) 100%);
    min-height:100vh; padding-bottom:2rem; transition:background 1s ease; -webkit-user-select:none; user-select:none;
  }
  body.theme-dragon{ --sky-top:#2E2A4A; --sky-bot:#4A3B6B; --grass:#5B4A8A; --grass-dark:#3E3160; --pop:#FFC93C; --basket:#5B3B7A; --basket-dark:#3E2758; }
  body.theme-star{ --sky-top:#121F3D; --sky-bot:#243B6B; --grass:#2C4A82; --grass-dark:#1B2F5C; --pop:#FFC93C; --basket:#2C4A82; --basket-dark:#1B2F5C; }
  body.theme-dragon h1, body.theme-star h1{ color:#E8E4FF; text-shadow:0 2px 8px rgba(0,0,0,.4); }
  body.theme-dragon .sub, body.theme-star .sub{ color:#C9C2F0; } body.theme-star .sub{ color:#AEC4F0; }

  header{ position:relative; z-index:2; text-align:center; padding:1.1rem 1rem .3rem; }
  h1{ margin:0; font-family:'Baloo 2',sans-serif; font-size:clamp(1.5rem,5vw,2.1rem); font-weight:800; color:#2c5a2e; text-shadow:0 2px 0 rgba(255,255,255,.55); }
  .sub{ font-weight:600; color:#3c6b3a; font-size:.85rem; margin-top:.15rem; }

  .topbar{ position:relative; z-index:2; display:flex; justify-content:center; gap:.6rem; align-items:center; margin-top:.6rem; }
  .stars{ display:flex; align-items:center; gap:.3rem; background:rgba(255,255,255,.72); backdrop-filter:blur(6px); border-radius:999px; padding:.35rem .8rem; font-weight:700; color:#7a5a12; font-size:.85rem; box-shadow:0 2px 0 rgba(0,0,0,.06); }
  .soundbtn{ background:rgba(255,255,255,.72); border:none; border-radius:999px; width:34px; height:34px; font-size:1rem; cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.06); }

  .orderwrap{ position:relative; z-index:2; display:flex; justify-content:center; margin:.9rem 1rem 0; }
  .order{ background:var(--card); border:3px solid var(--card-edge); border-radius:var(--radius); padding:.85rem 1.3rem; max-width:32rem; width:100%; text-align:center; box-shadow:0 8px 0 rgba(0,0,0,.08), 0 14px 24px rgba(0,0,0,.12); display:flex; align-items:center; gap:.8rem; }
  .mascot{ font-size:2.1rem; flex-shrink:0; animation:hover 2.4s ease-in-out infinite; }
  @keyframes hover{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-5px) rotate(4deg);} }
  .order-text{ text-align:left; } .order-text .who{ font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); }
  .order-text .ask{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(.95rem,3.2vw,1.25rem); color:var(--ink); line-height:1.25; }
  .order-text .ask b{ color:var(--apple-dark); }

  /* ---------- the pile: what hasn't been shared out yet ---------- */
  .pilewrap{ position:relative; z-index:2; display:flex; justify-content:center; margin:.8rem 1rem 0; }
  .pile{
    width:100%; max-width:30rem; min-height:3.6rem; background:rgba(255,255,255,.3); border:3px dashed rgba(255,255,255,.55);
    border-radius:18px; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.3rem; padding:.6rem;
  }
  .pile .item{ font-size:1.5rem; filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); transition:transform .15s, opacity .2s; }
  .pile .item.taken{ transform:scale(0); opacity:0; }
  .pilelabel{ text-align:center; font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.75); text-shadow:0 1px 2px rgba(0,0,0,.15); margin-top:.35rem; }

  /* ---------- the bags: tap one to send it the next apple ---------- */
  .bagsrow{ position:relative; z-index:2; display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin-top:1rem; padding:0 1rem; }
  .bag{ display:flex; flex-direction:column; align-items:center; gap:.35rem; cursor:pointer; }
  .bag-body{
    width:92px; min-height:74px; border-radius:0 0 16px 16px; border-top:5px solid var(--basket-dark);
    background:linear-gradient(180deg, var(--basket) 0%, var(--basket-dark) 100%);
    display:flex; flex-wrap:wrap; align-content:flex-start; justify-content:center; gap:.15rem;
    padding:.5rem .4rem; box-shadow:0 4px 0 rgba(0,0,0,.15), inset 0 -6px 10px rgba(0,0,0,.18);
    transition:transform .12s; border:3px solid transparent;
  }
  .bag:hover .bag-body{ transform:translateY(-2px); }
  .bag:active .bag-body{ transform:translateY(1px); }
  .bag.equal .bag-body{ border-color:#5ED39B; }
  .bag.uneven .bag-body{ border-color:var(--warn); }
  .bag-body .item{ font-size:1.05rem; transform:scale(0); filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
  .bag-body .item.pop{ animation:itemPop .28s cubic-bezier(.3,1.8,.4,1) forwards; }
  @keyframes itemPop{ 0%{ transform:scale(0) rotate(-20deg);} 60%{ transform:scale(1.3) rotate(6deg);} 100%{ transform:scale(1) rotate(0);} }
  .bag-count{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.05rem; background:rgba(255,255,255,.8); border-radius:999px; padding:.05rem .6rem; min-width:1.6rem; text-align:center; }

  .eqwrap{ position:relative; z-index:2; display:flex; justify-content:center; margin-top:.9rem; min-height:2.4rem; }
  .eq{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:clamp(.95rem,3.4vw,1.25rem); color:#3c6b3a; background:rgba(255,255,255,.55); border-radius:999px; padding:.35rem 1.1rem; text-align:center; transition:transform .2s; }
  .eq .final{ color:var(--apple-dark); }
  .eq .fair{ color:#2f7d4f; }
  .eq .unfair{ color:#a05a10; }
  .eq.pulse{ animation:eqpop .35s ease; }
  @keyframes eqpop{ 0%{ transform:scale(1);} 40%{ transform:scale(1.1);} 100%{ transform:scale(1);} }

  .controls{ position:relative; z-index:2; display:flex; justify-content:center; gap:.7rem; margin-top:1rem; flex-wrap:wrap; }
  button.action{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:.9rem; padding:.6rem 1.3rem; border-radius:999px; border:none; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.15); transition:transform .1s; }
  button.action:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.15); }
  button.action:disabled{ opacity:.4; cursor:default; box-shadow:none; }
  .btn-shuffle{ background:var(--pop); color:#fff; }
  .btn-next{ background:var(--sun); color:#6b4a06; }

  .pickers{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:.5rem; margin-top:1.3rem; }
  .pickerRow{ display:flex; gap:.45rem; flex-wrap:wrap; justify-content:center; }
  .pickerLabel{ font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.7); text-shadow:0 1px 2px rgba(0,0,0,.2); }
  .pill{ font-family:'Baloo 2',sans-serif; font-weight:700; border:none; cursor:pointer; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.14); transition:transform .1s, background .15s, color .15s; }
  .pill:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.14); }
  .themePill{ font-size:1.35rem; width:2.5rem; height:2.5rem; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.55); }
  .themePill.active{ background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.14), 0 0 0 3px var(--pop); }
  .numPill{ font-size:.95rem; padding:.45rem 1rem; background:rgba(255,255,255,.55); color:var(--ink); }
  .numPill.active{ background:var(--pop); color:#fff; }

  .tip{ position:relative; z-index:2; text-align:center; margin-top:.8rem; padding:0 1.2rem; font-size:.85rem; font-weight:600; color:#3c6b3a; min-height:1.2em; }
  .spark{ position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:50; }
  .toast{ position:fixed; left:50%; top:14%; transform:translate(-50%,-14px); z-index:60; background:var(--card); border:3px solid var(--sun); border-radius:18px; padding:.8rem 1.4rem; font-family:'Baloo 2',sans-serif; font-weight:700; color:var(--ink); text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.22); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<header>
  <h1>🍂 Fair Share</h1>
  <div class="sub" id="subLine">split the pile and see what fits evenly</div>
</header>

<div class="topbar">
  <div class="stars">🌻 <span id="doneCount">0</span> fair shares found</div>
  <button class="soundbtn" id="soundBtn" title="Toggle sound">🔊</button>
</div>

<div class="orderwrap">
  <div class="order">
    <div class="mascot" id="mascot">🐝</div>
    <div class="order-text">
      <div class="who" id="orderWho">Buzzby has</div>
      <div class="ask" id="orderText">…</div>
    </div>
  </div>
</div>

<div class="pilewrap"><div class="pile" id="pile"></div></div>
<div class="pilelabel"><span id="pileRemain">0</span> left to share out — tap a bag to give it one</div>

<div class="bagsrow" id="bagsRow"></div>

<div class="eqwrap"><div class="eq" id="eqLine">tap any bag to start sharing</div></div>

<div class="controls">
  <button class="action btn-shuffle" id="shuffleBtn">🔁 Shuffle back</button>
  <button class="action btn-next" id="nextBtn">🌼 New pile</button>
</div>

<div class="pickers">
  <div class="pickerRow"><span class="pickerLabel">choose your world</span></div>
  <div class="pickerRow" id="themeRow"></div>
  <div class="pickerRow"><span class="pickerLabel">how many bags?</span></div>
  <div class="pickerRow" id="bagRow"></div>
</div>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const pile = $('pile'), bagsRow = $('bagsRow'), orderText = $('orderText'), eqLine = $('eqLine'), tip = $('tip');
const shuffleBtn = $('shuffleBtn'), nextBtn = $('nextBtn'), soundBtn = $('soundBtn');

const THEMES = {
  apple:  { label:'Apple pile',  emoji:'🍎', mascot:'🐝', who:'Buzzby has',        containerSing:'bag',  containerPl:'bags',  fairMsg:'Shared fair and square!' },
  dragon: { label:'Dragon eggs', emoji:'🥚', mascot:'🐉', who:"Tim's dragon has",  containerSing:'nest', containerPl:'nests', fairMsg:'Every nest matches!' },
  star:   { label:'Star pile',   emoji:'⭐', mascot:'🦉', who:'Luna has',          containerSing:'jar',  containerPl:'jars',  fairMsg:'Every jar sparkles the same!' },
};
let theme = 'apple';
let bagCount = 2;

/* A mix of totals: some split evenly across every bag count from 2-5,
   some don't. That's deliberate — a total that refuses to split evenly
   into 3 but works cleanly into 2 or 4 is what makes a factor a real,
   discoverable thing rather than a fact to be told. */
const POOL = [6,8,9,10,12,14,15,16,18,20,21,24];
let lastTotal = null;

let total, remaining, bagContents, doneCount = 0;

/* ---------- tiny synth ---------- */
let actx, soundOn = true;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }
function tone(freq,dur,type,vol,delay){
  if(!soundOn) return; ensureAudio();
  const t0=actx.currentTime+(delay||0), osc=actx.createOscillator(), gain=actx.createGain();
  osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0); gain.gain.linearRampToValueAtTime(vol||.18,t0+.01);
  gain.gain.exponentialRampToValueAtTime(.001,t0+dur);
  osc.connect(gain).connect(actx.destination); osc.start(t0); osc.stop(t0+dur+.02);
}
const sfxDrop = i => tone(420+i*40,.09,'triangle',.13);
const sfxFair = () => [523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.16,i*.09));
const sfxUneven = () => { tone(300,.12,'sawtooth',.11); tone(240,.14,'sawtooth',.09,.06); };
soundBtn.onclick = () => { soundOn=!soundOn; soundBtn.textContent = soundOn?'🔊':'🔇'; if(soundOn) ensureAudio(); };

function newPile(){
  let t;
  do { t = POOL[(Math.random()*POOL.length)|0]; } while (t === lastTotal);
  lastTotal = t; total = t; remaining = t;
  bagContents = Array(bagCount).fill(0);
  const th = THEMES[theme];
  orderText.innerHTML = `<b>${total}</b> ${th.containerSing==='bag'?'apples':th.containerSing==='nest'?'eggs':'stars'} — share into <b>${bagCount}</b> ${th.containerPl}`;
  eqLine.textContent = 'tap any bag to start sharing';
  tip.textContent = '';
  renderPile();
  renderBags();
}

function renderPile(){
  const th = THEMES[theme];
  pile.innerHTML = '';
  for (let i=0;i<remaining;i++){
    const s = document.createElement('span');
    s.className = 'item';
    s.textContent = th.emoji;
    pile.appendChild(s);
  }
  $('pileRemain').textContent = remaining;
}

function renderBags(){
  const th = THEMES[theme];
  bagsRow.innerHTML = '';
  for (let b=0; b<bagCount; b++){
    const bag = document.createElement('div');
    bag.className = 'bag';
    bag.innerHTML = `<div class="bag-body" id="bagBody${b}"></div><div class="bag-count" id="bagCount${b}">${bagContents[b]}</div>`;
    bag.onclick = () => giveToBag(b);
    bagsRow.appendChild(bag);
    for (let i=0;i<bagContents[b];i++){
      const s = document.createElement('span'); s.className = 'item pop'; s.textContent = th.emoji;
      bag.querySelector('.bag-body').appendChild(s);
    }
  }
}

/* ---------- the one action: tap a bag, it takes the next apple ----------
   Deliberately the only interaction — no dragging, no choosing which
   exact apple. That keeps the decision entirely about WHICH BAG gets the
   next one, which is the actual decision "sharing fairly" requires. */
function giveToBag(b){
  if (remaining <= 0) return;
  ensureAudio();
  remaining--;
  bagContents[b]++;
  sfxDrop(bagContents[b]);
  renderPile();
  const th = THEMES[theme];
  const body = document.getElementById('bagBody'+b);
  const s = document.createElement('span'); s.className = 'item'; s.textContent = th.emoji;
  body.appendChild(s);
  requestAnimationFrame(() => s.classList.add('pop'));
  document.getElementById('bagCount'+b).textContent = bagContents[b];
  updateEquation();
  if (remaining === 0) checkFair();
}

function updateEquation(){
  const placed = total - remaining;
  eqLine.textContent = bagContents.join(' + ') + (remaining>0 ? `   (${remaining} left)` : '');
  eqLine.classList.remove('pulse'); void eqLine.offsetWidth; eqLine.classList.add('pulse');
}

function checkFair(){
  const th = THEMES[theme];
  const first = bagContents[0];
  const isFair = bagContents.every(n => n === first);
  document.querySelectorAll('.bag').forEach((el,i) => el.classList.add(isFair ? 'equal' : 'uneven'));

  if (isFair){
    sfxFair();
    eqLine.innerHTML = `<span class="fair">${bagCount} × ${first} = ${total}</span> <span style="opacity:.6">&nbsp;and&nbsp;</span> <span class="fair">${total} ÷ ${bagCount} = ${first}</span>`;
    showToast(`🎉 ${first} in every ${th.containerSing}! ${th.fairMsg}`);
    burst();
    doneCount++; $('doneCount').textContent = doneCount;
    tip.textContent = `${total} splits evenly into ${bagCount} ${th.containerPl} — try a different number of bags next!`;
  } else {
    sfxUneven();
    eqLine.innerHTML = `<span class="unfair">${bagContents.join(', ')}</span> <span style="opacity:.6">— not equal</span>`;
    tip.textContent = `${total} doesn't split evenly into ${bagCount} ${th.containerPl} this way — shuffle back and try spreading them differently, or try a different number of bags.`;
  }
}

function shuffleBack(){
  remaining = total;
  bagContents = Array(bagCount).fill(0);
  eqLine.textContent = 'tap any bag to start sharing';
  renderPile(); renderBags();
  tip.textContent = '';
}
shuffleBtn.onclick = shuffleBack;
nextBtn.onclick = newPile;

/* ---------- pickers ---------- */
function buildPickers(){
  const themeRow = $('themeRow');
  themeRow.innerHTML = '';
  Object.entries(THEMES).forEach(([key, t]) => {
    const b = document.createElement('button');
    b.className = 'pill themePill' + (key === theme ? ' active' : '');
    b.textContent = t.emoji; b.title = t.label; b.setAttribute('aria-label', t.label);
    b.onclick = () => selectTheme(key);
    themeRow.appendChild(b);
  });
  const bagRow = $('bagRow');
  bagRow.innerHTML = '';
  [2,3,4,5].forEach(n => {
    const b = document.createElement('button');
    b.className = 'pill numPill' + (bagCount === n ? ' active' : '');
    b.textContent = n;
    b.onclick = () => selectBagCount(n);
    bagRow.appendChild(b);
  });
}

function applyThemeChrome(){
  const t = THEMES[theme];
  $('mascot').textContent = t.mascot;
  $('orderWho').textContent = t.who;
  document.body.className = theme === 'apple' ? '' : 'theme-' + theme;
}

function selectTheme(key){
  if (key === theme) return;
  theme = key; buildPickers(); applyThemeChrome(); newPile();
}
function selectBagCount(n){
  if (n === bagCount) return;
  bagCount = n; buildPickers(); newPile();
}

function showToast(text){
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1900);
}
function burst(){
  const cols_ = ['#FFC93C','#E85B4A','#4C8C3D','#8B6BD8','#fff'];
  const rect = bagsRow.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for (let i=0;i<28;i++){
    const p = document.createElement('div');
    p.className = 'spark';
    p.style.left = cx+'px'; p.style.top = cy+'px';
    p.style.background = cols_[(Math.random()*cols_.length)|0];
    document.body.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 60+Math.random()*160;
    const dx = Math.cos(a)*d, dy = Math.sin(a)*d - 40;
    const dur = 700+Math.random()*400;
    p.animate([
      { transform:'translate(-50%,-50%) scale(1)', opacity:1 },
      { transform:`translate(${dx}px,${dy+120}px) scale(.3)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(.15,.7,.3,1)' });
    setTimeout(()=>p.remove(), dur+30);
  }
}

buildPickers();
applyThemeChrome();
newPile();
</script>
</body>
</html>
